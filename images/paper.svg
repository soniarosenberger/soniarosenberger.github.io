<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <!-- Very light cold-press grain -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feDiffuseLighting lighting-color="#ffffff" surfaceScale="1.6">
      <feDistantLight azimuth="45" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.39  0 0 0 0 0.37  -0.9 0 0 0 0.9"/>
  </filter>
  <!-- Sparse, soft patches: only the lowest parts of the noise show through -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="4" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.6  0 0 0 0 0.56  -4 0 0 0 1.55"/>
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.05"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.04"/>
</svg>
