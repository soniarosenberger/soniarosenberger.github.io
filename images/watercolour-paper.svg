<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">
  <!-- Cold-press watercolour paper: neutral off-white with visible tooth and soft uneven sizing -->
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feDiffuseLighting lighting-color="#ffffff" surfaceScale="2.4">
      <feDistantLight azimuth="135" elevation="55"/>
    </feDiffuseLighting>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.42  0 0 0 0 0.42  -1 0 0 0 1"/>
  </filter>
  <filter id="sizing" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.62  0 0 0 0 0.62  -2.2 0 0 0 1.25"/>
  </filter>
  <rect width="100%" height="100%" fill="#f9f9f9"/>
  <rect width="100%" height="100%" filter="url(#sizing)" opacity="0.12"/>
  <rect width="100%" height="100%" filter="url(#tooth)" opacity="0.28"/>
</svg>
