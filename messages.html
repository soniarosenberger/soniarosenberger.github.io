<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonia Rosenberger — Messages</title>
  <meta name="description" content="Sonia Rosenberger — art, music, writing and projects.">
  <link rel="stylesheet" href="css/fonts.css?v=10">
  <link rel="stylesheet" href="css/style.css?v=286">
  <link rel="stylesheet" href="css/lettering.css?v=2">
</head>
<body>
  <header class="site-header">
    <p class="site-name"><a href="index.html">Sonia Rosenberger</a></p>
    <nav class="site-nav" aria-label="Main">
      <a href="art.html">art</a>
      <a href="music.html">music</a>
      <a href="writing.html" aria-current="page">writing</a>
      <a href="projects.html">projects</a>
      <a href="about.html">about</a>
    </nav>
  </header>

  <main class="messages-page">
    <h1 class="visually-hidden">Messages</h1>
    <div class="messages-phone">
      <button class="phone-closed" type="button" aria-label="Open the phone">
        <img src="images/writing/icons/phone.png?v=3" width="230" height="496" alt="">
        <span class="phone-screen is-lit" aria-hidden="true"><svg class="phone-envelope" viewBox="0 0 11 8" shape-rendering="crispEdges"><path d="M0.5 0.5h10v7h-10z M0.5 0.5l5 4 5-4"/></svg><span class="phone-new">New Messages</span></span>
      </button>
      <div class="phone-open" hidden>
        <div class="quote-screen">
          <div class="lcd-status" aria-hidden="true">
            <svg class="lcd-icon" viewBox="0 0 7 7" shape-rendering="crispEdges"><path d="M0 5h1v2H0zM2 4h1v3H2zM4 2h1v5H4zM6 0h1v7H6z"/></svg>
            <span class="lcd-clock"></span>
            <svg class="lcd-icon lcd-icon--battery" viewBox="0 0 12 7" shape-rendering="crispEdges"><path fill-rule="evenodd" d="M0 0h10v7H0zM1 1v5h8V1zM10 2h2v3h-2zM2 2h2v3H2zM5 2h2v3H5z"/></svg>
          </div>
          <div class="quote-bar"><span><svg class="lcd-icon" viewBox="0 0 9 7" shape-rendering="crispEdges"><path fill-rule="evenodd" d="M0 0h9v7H0zM1 1v5h7V1z"/><path d="M1 1h1v1H1zM2 2h1v1H2zM3 3h1v1H3zM4 4h1v1H4zM5 3h1v1H5zM6 2h1v1H6zM7 1h1v1H7z"/></svg>Inbox</span><span class="quote-count"></span></div>
          <div class="quote-body" aria-live="polite"></div>
          <div class="lcd-glass" aria-hidden="true"></div>
        </div>
        <img class="phone-frame" src="images/writing/icons/phone-open-frame.png?v=1" width="206" height="707" alt="">
        <button class="phone-key phone-key--left" type="button" aria-label="Previous message"></button>
        <button class="phone-key phone-key--right" type="button" aria-label="Next message"></button>
        <button class="phone-key phone-key--end" type="button" aria-label="Close the phone"></button>
      </div>
    </div>
    <p class="messages-caption">Things My Friends Have Said To Me</p>
    <p class="project-back messages-back"><a href="writing.html">back to writing</a></p>
  </main>

  <footer class="site-footer">
    <p><a href="mailto:sonia@soniarosenberger.com">sonia@soniarosenberger.com</a></p>
    <p>&copy; <span id="year"></span> Sonia Rosenberger</p>
    <p class="guestbook-link"><a href="guestbook.html">guestbook</a></p>
  </footer>

  <script src="js/main.js?v=28"></script>
  <script src="js/messages.js?v=13"></script>
</body>
</html>
